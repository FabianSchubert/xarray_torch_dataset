[project]
name = "xarray-torch-dataset"
version = "0.1.0"
description = "PyTorch datasets on top of xarray, built from small, swappable parts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "torch>=2.9",
    "xarray>=2025.7.0",
    "zarr>=3.1.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dask>=2026.8.0",
    "gcsfs>=2026.10.0",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
